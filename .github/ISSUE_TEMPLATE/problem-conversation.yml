name: Share a policy-transfer experience
description: Volunteer for a 30-minute problem conversation about reproducing a robot policy.
title: "[Conversation]: "
labels: ["phase-1", "problem-conversation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping document where robot-policy transfer breaks. This is research, not a product pitch. Do not include confidential information, credentials, private datasets, or personally identifying data you do not want public.
  - type: dropdown
    id: role
    attributes:
      label: Your closest role
      options:
        - Robotics student or researcher
        - Open-source maintainer
        - Robotics startup engineer
        - Simulation developer
        - System integrator
        - Low-cost robot owner
        - Robotics educator
        - Other practitioner
    validations:
      required: true
  - type: input
    id: attempted-policy
    attributes:
      label: Policy or project you attempted to reproduce
      description: A public URL is welcome but not required.
      placeholder: "Example: an ACT policy from a Hugging Face repository"
    validations:
      required: true
  - type: textarea
    id: last-attempt
    attributes:
      label: Walk us through the last attempt
      description: What were you trying to do, and where did the workflow become difficult?
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: Missing or incorrect information
      description: Consider versions, calibration, cameras, action/observation shapes, hardware, dependencies, and evaluation protocol.
    validations:
      required: true
  - type: input
    id: time-cost
    attributes:
      label: Approximate time spent
      placeholder: "Example: two days before first movement; one week before a valid trial"
    validations:
      required: true
  - type: textarea
    id: success-test
    attributes:
      label: How did you decide whether it worked?
      description: Describe the test, number of trials, success rule, and where you recorded the result.
    validations:
      required: true
  - type: textarea
    id: remove-work
    attributes:
      label: What would you happily never do manually again?
    validations:
      required: true
  - type: dropdown
    id: follow-up
    attributes:
      label: Follow-up format
      options:
        - Continue asynchronously in this issue
        - Schedule a 30-minute call through GitHub replies
        - No follow-up; use this account only
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Publication consent
      options:
        - label: I understand this issue is public and may be quoted with attribution.
          required: true
        - label: I am authorized to share the information above.
          required: true
